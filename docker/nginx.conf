server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Routing is client-side, so any path that is not a real file has to return
    # index.html. Without this a refresh on /quizzes is a 404, and so is the
    # join link behind the QR code in the host lobby, which players open as
    # their very first request.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset filenames carry a content hash, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must not be cached: it is what points at the hashed assets, and
    # a stale copy would reference files that the next deployment removed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
