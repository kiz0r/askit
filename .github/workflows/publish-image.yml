name: Publish container image

# Builds the frontend image and pushes it to GHCR. Vite compiles the API and
# WebSocket origins into the bundle, so they are build arguments here rather
# than runtime configuration: an image belongs to one deployment.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Frontend and API are served from the same origin, so both point at the site
  # itself. Change these together with the domain and rebuild.
  PUBLIC_ASKIT_SERVER_URL: https://askit.fjfi.cvut.cz
  PUBLIC_ASKIT_WEBSOCKET_URL: wss://askit.fjfi.cvut.cz

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_ASKIT_SERVER_URL=${{ env.PUBLIC_ASKIT_SERVER_URL }}
            PUBLIC_ASKIT_WEBSOCKET_URL=${{ env.PUBLIC_ASKIT_WEBSOCKET_URL }}
          # Without a cache every run reinstalls the whole dependency tree.
          cache-from: type=gha
          cache-to: type=gha,mode=max
